name: Publish container image

on:
  push:
    branches: [main]
    paths:
      - image/**
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:image"
          pull: true
          push: true
          tags: ghcr.io/linyinfeng/codex-cloud-env:latest
          labels: |
            org.opencontainers.image.source=https://github.com/linyinfeng/codex-cloud-env
          cache-from: type=gha
          cache-to: type=gha,mode=max
